[package]
name = "tfa-setup"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
description = "Transformers Armada recomp setup: your disc in, the game out (a window over setup.ps1)"
build = "build.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.17"

[build-dependencies]
embed-resource = "3.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1   # (one unit: smaller, and the same bytes from the same sources - build.ps1)

[workspace]
